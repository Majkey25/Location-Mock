# Check twice weekly in UTC, with stable times per repository, ecosystem and directory.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: cron
      cronjob: "13 13 * * 2,6"
      timezone: Etc/UTC
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "32 4 * * 3,6"
      timezone: Etc/UTC
